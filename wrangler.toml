name = "sintlucasmasters"
main = "src/index.tsx"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat", "rpc"]

[version_metadata]
binding = "CF_VERSION_METADATA"

# Static assets from the static folder
[assets]
directory = "./static"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "sintlucasmasters"
database_id = "4227d715-382f-416a-aa9c-c5da32847400"
migrations_dir = "migrations"
migrations_table = "d1_migrations"

# Transactional email (magic links, review notifications) via Cloudflare Email
# Service. The sender domain must be onboarded under Compute > Email Service >
# Email Sending. `wrangler dev` simulates the binding and logs messages instead
# of sending them.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["info@sintlucasmasters.com"]

# Environment variables (secrets set via `wrangler secret put`)
# JWT_SECRET - Secret for signing JWT tokens
# CLOUDFLARE_ACCOUNT_ID - Cloudflare account ID for Images API
# CLOUDFLARE_API_TOKEN - Cloudflare API token with Images permissions

[vars]
APP_BASE_URL = "https://sintlucasmasters.com"
SENTRY_DSN = "https://940c808bee865bc2ba2d24da4101ef17@o4510688180568064.ingest.de.sentry.io/4510832618831952"
SENTRY_HOST = "o4510688180568064.ingest.de.sentry.io"
SENTRY_PROJECT_ID = "4510832618831952"

# Production overrides
[env.production.vars]
# APP_BASE_URL is retained for the auth flow's magic-link emails (single
# central inbox across all three sites). Per-request site URLs are derived
# from the Host header — see src/sites.ts.
APP_BASE_URL = "https://sintlucasmasters.com"
SENTRY_DSN = "https://940c808bee865bc2ba2d24da4101ef17@o4510688180568064.ingest.de.sentry.io/4510832618831952"
SENTRY_HOST = "o4510688180568064.ingest.de.sentry.io"
SENTRY_PROJECT_ID = "4510832618831952"

# Custom domain routes — all three sites are served by this single Worker.
# Cloudflare requires the zones to exist in the same account; SSL is automatic.
[[env.production.routes]]
pattern = "sintlucasmasters.com"
custom_domain = true

[[env.production.routes]]
pattern = "www.sintlucasmasters.com"
custom_domain = true

[[env.production.routes]]
pattern = "sintlucasfotografie.com"
custom_domain = true

[[env.production.routes]]
pattern = "www.sintlucasfotografie.com"
custom_domain = true

[[env.production.routes]]
pattern = "sintlucasgraduates.com"
custom_domain = true

[[env.production.routes]]
pattern = "www.sintlucasgraduates.com"
custom_domain = true

[[r2_buckets]]
binding = "FILES"
bucket_name = "sintlucasmasters"

# Cron trigger for cleaning up expired auth tokens
[triggers]
crons = ["0 0 * * *"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true
